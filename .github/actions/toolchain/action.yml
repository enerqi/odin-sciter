# Installs the tools every job here needs, pinned and cached.
#
# Deliberately no third-party actions: everything below is a curl of a release archive from the
# project's own GitHub releases, so the only trust decisions are "GitHub" and "the pinned version".
# A marketplace action would be a fourth supply chain in a repository whose entire pitch is that it
# has one dependency.
#
# The archives do not agree on layout - Odin's tarball has a single top-level directory whose name
# carries a build date that is NOT derivable from the release tag (`dev-2026-08` unpacks
# `odin-linux-amd64-nightly+2026-08-06/`), while just's has its binary at the root. `unpack_into`
# below handles both by looking at what came out rather than assuming.
#
# **Everything installs under `~/.odin-tools/<tool>/<version>/`**, the same root and the same
# version-in-the-path scheme `just fetch-odinfmt` uses - so CI and a developer machine lay their tools
# out identically, and `~/.odin-tools` is the one place to look or delete. It used to be a flat
# `~/.odin-sciter-tools/<tool>/`: project-named, so unshareable with any other Odin checkout, and
# unversioned, so the directory could hold a version nobody asked for with nothing in the path to say
# so. That is the failure the odinfmt pin was added to prevent, and this action was still an example
# of it. odinfmt lands in the same tree from `just fetch-odinfmt`, so the cache below now carries it
# too, at no extra configuration.
name: toolchain
description: Install Odin, just and uv - pinned, cached, no marketplace actions. odinfmt comes from `just fetch-odinfmt`.

inputs:
  odin-version:
    description: Odin release tag, e.g. dev-2026-08
    required: false
    default: dev-2026-08
  just-version:
    description: just release version, e.g. 1.55.1
    required: false
    default: 1.55.1
  # No odinfmt here. It used to be an `odinfmt` boolean plus an `ols-version` default of `dev-2026-06`,
  # and that default was the only place the formatter version was written down - so CI formatted with
  # one odinfmt and developers with whatever ols they had built, which diverged and failed four files.
  # The pin is `ols_tag` in the justfile now, and `just format` / `format-check` / `bindgen` fetch it
  # through `ensure-odinfmt`. Nothing here installs it, so nothing here can disagree with it.
  uv:
    description: install uv - every `[script]` recipe runs Python through it, so this is on by default
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Resolve platform names
      id: plat
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   odin=odin-linux-amd64  ; odin_ext=tar.gz ; just=x86_64-unknown-linux-musl ;;
          macOS-ARM64) odin=odin-macos-arm64  ; odin_ext=tar.gz ; just=aarch64-apple-darwin     ;;
          macOS-X64)   odin=odin-macos-amd64  ; odin_ext=tar.gz ; just=x86_64-apple-darwin      ;;
          Windows-X64) odin=odin-windows-amd64; odin_ext=zip    ; just=x86_64-pc-windows-msvc   ;;
          *) echo "::error::unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        {
          echo "odin=$odin"
          echo "odin_ext=$odin_ext"
          echo "just=$just"
          echo "tools=$HOME/.odin-tools"
        } >> "$GITHUB_OUTPUT"

    - name: Cache toolchain
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.odin-tools
        # **A shorter key than before, which is a hazard worth knowing about.** GitHub's cache service
        # matches the requested key as a *prefix*, not just exactly - `restore-keys` are additional
        # prefixes, not the only ones. `actions/cache` then compares what came back against the key you
        # asked for and reports `cache-hit: false` when they differ, *having already restored the
        # files*. So a key that is a strict prefix of an older one restores that older cache and then
        # tells you it did not.
        #
        # Measured, because it broke this action: dropping the `-ols…-fmt…` components left
        # `tools-Linux-X64-odin…-just1.55.1`, a prefix of the existing
        # `tools-Linux-X64-odin…-just1.55.1-olsdev-2026-06-fmttrue`. 66 MB was restored, the unpack step
        # ran anyway because cache-hit was false, and it died on `mv: cannot overwrite
        # '~/.odin-sciter-tools/odin/base': Directory not empty` - that being the root at the time.
        #
        # Nothing special guards it now, because nothing needs to: the payload lives under
        # `<tool>/<version>/`, so a restored older cache cannot occupy the directory this run wants,
        # and `unpack_into` clears its destination regardless. If you ever shorten this key again while
        # flattening those paths, both of those go away and this comes back.
        key: tools-${{ runner.os }}-${{ runner.arch }}-odin${{ inputs.odin-version }}-just${{ inputs.just-version }}

    - name: Download and unpack
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TOOLS: ${{ steps.plat.outputs.tools }}
      run: |
        set -euo pipefail

        # Unpack $1 into $2, flattening a single top-level directory if the archive has one.
        unpack_into() {
          local archive="$1" dest="$2" tmp
          tmp="$(mktemp -d)"
          case "$archive" in
            *.zip)    unzip -q "$archive" -d "$tmp" ;;
            *.tar.gz) tar xzf "$archive" -C "$tmp" ;;
            *) echo "::error::unknown archive type $archive"; return 1 ;;
          esac
          # A clean destination, because `mv` onto a populated one does not merge - it fails with
          # "Directory not empty" per subdirectory and takes the job with it. This step already
          # believes it is installing from scratch (it only runs on a cache miss), so anything already
          # there is either a partial restore or a re-run, and in both cases the archive wins.
          # `$dest` is always "$TOOLS/<tool>/<version>" and `set -u` catches an unset one.
          rm -rf "$dest"
          mkdir -p "$dest"
          # shellcheck disable=SC2012
          if [ "$(ls -1 "$tmp" | wc -l)" -eq 1 ] && [ -d "$tmp/$(ls -1 "$tmp")" ]; then
            mv "$tmp/$(ls -1 "$tmp")"/* "$dest/"
          else
            mv "$tmp"/* "$dest/"
          fi
          rm -rf "$tmp"
        }

        mkdir -p "$TOOLS"
        cd "$(mktemp -d)"

        odin_asset='${{ steps.plat.outputs.odin }}-${{ inputs.odin-version }}.${{ steps.plat.outputs.odin_ext }}'
        curl -fsSL -o "$odin_asset" \
          "https://github.com/odin-lang/Odin/releases/download/${{ inputs.odin-version }}/$odin_asset"
        unpack_into "$odin_asset" "$TOOLS/odin/${{ inputs.odin-version }}"
        chmod +x "$TOOLS/odin/${{ inputs.odin-version }}/odin" 2>/dev/null || true

        just_asset='just-${{ inputs.just-version }}-${{ steps.plat.outputs.just }}'
        if [ "$RUNNER_OS" = "Windows" ]; then just_asset="$just_asset.zip"; else just_asset="$just_asset.tar.gz"; fi
        curl -fsSL -o "$just_asset" \
          "https://github.com/casey/just/releases/download/${{ inputs.just-version }}/$just_asset"
        unpack_into "$just_asset" "$TOOLS/just/${{ inputs.just-version }}"
        chmod +x "$TOOLS/just/${{ inputs.just-version }}/just" 2>/dev/null || true

        # odinfmt is deliberately absent - `just fetch-odinfmt` installs the version the justfile pins,
        # into ~/.odin-tools/ols/<tag>/. See the note beside the inputs above.

    # **Every path written to GITHUB_PATH has to be native, and this step runs in bash.** On a Windows
    # runner `$HOME` in Git bash is the MSYS spelling - `/c/Users/runneradmin` - so a bare
    # `echo "$TOOLS/just" >> "$GITHUB_PATH"` publishes a path that bash can use and *nothing else can*.
    # Every later step then has to be `shell: bash` or it fails with
    #
    #     The term 'just' is not recognized as a name of a cmdlet, function, script file, ...
    #
    # which reads as a failed install rather than a mistranslated path. `cygpath -w` is the conversion,
    # and Git for Windows ships it; `add_path` falls through to the plain path everywhere else.
    - name: Add to PATH
      shell: bash
      env:
        TOOLS: ${{ steps.plat.outputs.tools }}
      run: |
        set -euo pipefail
        add_path() {
          if [ "$RUNNER_OS" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
            cygpath -w "$1" >> "$GITHUB_PATH"
          else
            echo "$1" >> "$GITHUB_PATH"
          fi
        }
        add_path "$TOOLS/odin/${{ inputs.odin-version }}"
        add_path "$TOOLS/just/${{ inputs.just-version }}"

    # uv is what `set script-interpreter` in the justfile runs, so every `[script]` recipe - `check`,
    # `lint`, `cross-check`, `example-tests` and the rest - needs it. It used to be opt-in for `bindgen`
    # alone, back when those recipes were bash; they are Python now, because `just` cannot reliably find
    # a bash on Windows (see justlib.py's header).
    #
    # Two installers, because Astral ships two. The shell one puts uv in ~/.local/bin; the PowerShell one
    # puts it in %USERPROFILE%\.local\bin, which is the same directory spelled differently, so one
    # GITHUB_PATH line covers both.
    - name: Install uv
      if: inputs.uv == 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        curl -LsSf https://astral.sh/uv/install.sh | sh

    - name: Install uv (Windows)
      if: inputs.uv == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: irm https://astral.sh/uv/install.ps1 | iex

    - name: Add uv to PATH
      if: inputs.uv == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" = "Windows" ] && command -v cygpath >/dev/null 2>&1; then
          cygpath -w "$HOME/.local/bin" >> "$GITHUB_PATH"
        else
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Report versions
      shell: bash
      run: |
        set -euo pipefail
        odin version
        just --version
        if [ '${{ inputs.uv }}' = 'true' ]; then uv --version; fi

    # **The step above proves nothing about the Windows jobs, and that is why this one exists.** It runs
    # in bash, where an MSYS-spelled PATH entry resolves - so it stayed green through exactly the bug
    # this pair now guards against, while every `just` step in the Windows job failed. The jobs run their
    # recipes in the default shell (pwsh on Windows), so that is the shell the toolchain has to be
    # reachable from.
    - name: Report versions (default shell)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        odin version
        just --version
        if ('${{ inputs.uv }}' -eq 'true') { uv --version }
