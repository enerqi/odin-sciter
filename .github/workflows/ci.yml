# The regression gate for the repository, and the automated part of docs/UPGRADING.md's upgrade
# procedure: steps 6 (api_map against the shipped engine) and 7 (check, tests, ASan) run here on every
# push, so a PR that bumps the vendored engine gets the whole battery without anyone remembering to
# run it. Steps 2 (read the SDK changelog), 8 (look at a window) and 9 (docs) stay human - CI cannot
# see that a window renders blank.
#
# Platform jobs are gated on the binary actually being vendored rather than being deleted or left to
# fail: `lib/windows/x64/sciter.dll` and `lib/macos/**` do not exist today, so those jobs report what
# they skipped and why. Vendoring the binary is the whole of turning them on - see
# docs/WINDOWS-CHECKLIST.md, whose steps 2, 4, 5, 7 and 8 are what the Windows job below runs.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-08
  JUST_VERSION: 1.55.1

jobs:
  linux:
    name: linux x64 (engine vendored)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      # X11 and EGL development packages, the engine's own runtime dependencies, and fonts. The script
      # says which group is which and how each one fails when it is missing.
      - name: Install build and runtime dependencies
        run: .github/scripts/install-linux-deps.sh

      # The step the upgrade procedure exists for. No display needed - it loads the library and walks
      # the table without creating a window.
      - name: Verify the ISciterAPI table
        run: just api-map-verify

      - name: Type check and build everything
        run: just check

      # Is there a working renderer at all? The engine draws through EGL/GLESv2, so on a runner with no
      # GPU everything below depends on llvmpipe being reachable. Printed before the tests rather than
      # inferred from their wreckage: a segfault inside the first windowed test looks identical whether
      # the cause is the bindings or an EGL that never initialised.
      - name: Probe the display stack
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -uo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -c 'echo "DISPLAY=$DISPLAY"; xdpyinfo | head -12'

      # Xvfb because the windowed tests gate themselves on DISPLAY/WAYLAND_DISPLAY and would otherwise
      # skip ~two thirds of the suite. The screen is given explicitly because Xvfb's default depth is
      # not guaranteed to be 24, and an 8-bit screen is a rendering failure that looks like an engine
      # bug. XMODIFIERS=@im=none because this engine build segfaults in XSetICFocus when a window takes
      # focus and an X input method is present - see README.md. LIBGL_ALWAYS_SOFTWARE and
      # GALLIUM_DRIVER because the runner has no GPU: the first covers the GL path, the second is the
      # one that applies to EGL, which is what the engine actually uses.
      #
      # EXAMPLE_TEST_TIMEOUT bounds each example rather than the job: a windowed test on a display that
      # cannot render blocks on the message pump, and a job-level timeout would tell you only that
      # something hung. `exit 124` in the recipe's summary is that ceiling firing.
      #
      # No blanket retry: the recipe now runs every example and reports which ones failed, so one red
      # run is a complete picture. If the timing-sensitive element-timer tests in events.odin turn out
      # to flake here the way they do on a loaded desktop, that is a reason to fix the tests, not to
      # run the suite twice.
      - name: Run the example tests
        timeout-minutes: 45
        env:
          XMODIFIERS: '@im=none'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          EXAMPLE_TEST_TIMEOUT: '420'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" just example-tests

      # Value refcounting is the code most worth running under a sanitizer, and per the justfile's own
      # notes Linux ASan catches heap errors that Windows ASan does not - so this runs here or nowhere.
      - name: Value refcounting under ASan
        timeout-minutes: 20
        env:
          XMODIFIERS: '@im=none'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" just test_sanitize eval

  cross-check:
    name: cross target type check (windows, macos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
      # No engine needed: this is `odin check -target:`, the cheap half of a port. It is the only
      # thing standing between a Linux-only edit and a platform that stops compiling silently.
      - run: just cross-check

  windows:
    name: windows x64 (needs the engine vendored)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      - name: Is the engine vendored?
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          if [ -f lib/windows/x64/sciter.dll ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::lib/windows/x64/sciter.dll is not vendored - skipping the runtime steps. Step 1 of docs/WINDOWS-CHECKLIST.md is what turns this job on."
          fi

      # Checklist step 2, and the same weaker check the example's header describes: sciter.dll exports
      # one symbol, so almost every slot resolves as `sciter.dll+0x...` and containment is what is
      # being asserted. The null list is expected to differ from Linux and is reported, not enforced,
      # until a real run records it.
      - name: Verify the ISciterAPI table
        if: steps.engine.outputs.have == 'true'
        shell: bash
        run: just api-map-verify

      # Checklist step 4. Note single_binary's `when` needs extending once the DLL is vendored
      # (checklist step 8) or this fails on its deliberate #panic - that is the failure telling you
      # to do step 8, not a broken build.
      - name: Type check and build everything
        if: steps.engine.outputs.have == 'true'
        shell: bash
        run: just check

      # Checklist step 5, and it has a question attached: the windowed tests gate on
      # DISPLAY/WAYLAND_DISPLAY, which are POSIX variables that do not exist on Windows. Watch whether
      # this run skips them (wrong, but harmless) or runs them (correct). If it skips, the gate needs
      # to treat Windows as always having a display.
      - name: Run the example tests
        if: steps.engine.outputs.have == 'true'
        shell: bash
        run: just example-tests

  macos:
    name: macos (needs the engine vendored)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      # macOS ships untested and says so (README.md's platform table). The arm64 runner also means the
      # binary to vendor is the arm64 one, or a universal build.
      - name: Is the engine vendored?
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          if ls lib/macos/*/libsciter.dylib >/dev/null 2>&1; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no libsciter.dylib under lib/macos/ - skipping the runtime steps. macOS is unvendored and untested; see external/sciter/VENDORED.md."
          fi

      - name: Verify the ISciterAPI table
        if: steps.engine.outputs.have == 'true'
        run: just api-map-verify

      - name: Type check and build everything
        if: steps.engine.outputs.have == 'true'
        run: just check

      - name: Run the example tests
        if: steps.engine.outputs.have == 'true'
        run: just example-tests
