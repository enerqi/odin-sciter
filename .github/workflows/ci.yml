# The regression gate for the repository, and the automated part of docs/UPGRADING.md's upgrade
# procedure: steps 6 (api_map against the shipped engine) and 7 (check, tests, ASan) run here on every
# push, so a PR that bumps the vendored engine gets the whole battery without anyone remembering to
# run it. Steps 2 (read the SDK changelog), 8 (look at a window) and 9 (docs) stay human - CI cannot
# see that a window renders blank.
#
# **No engine is committed to this repository.** All three platform jobs fetch theirs as their first
# real step - `just fetch-engine`, which downloads the pinned binary and verifies it against the
# per-platform SHA-256 in external/sciter/VENDORED.md. That is the decision in docs/UPGRADING.md, taken
# for all three at once so that history carried one copy of each engine rather than one per bump.
#
# Both "is the engine vendored?" guards are gone with the binaries they guarded. A guard whose answer is
# now always "no" would skip the runtime steps and report the job green, which is exactly the dead-glob
# failure the macOS job had. The fetch is the gate: it fails loudly and it names the mismatch.
# docs/WINDOWS-CHECKLIST.md and docs/MACOS-CHECKLIST.md are the measurement records for those two.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ODIN_VERSION: dev-2026-08
  JUST_VERSION: 1.55.1

jobs:
  linux:
    name: linux x64 (engine fetched)
    runs-on: ubuntu-24.04
    # The engine picks its windowing backend from XDG_SESSION_TYPE, and gets it wrong when the variable
    # is not set - which is the normal state of a CI runner, a container, or an ssh session. Only the
    # literal `x11` selects the X11 backend; unset, `wayland` and `tty` all select a GTK4 path that
    # calls a NULL function pointer in `wing::internal::PollMonitorsGtk4` during `SciterExec(.INIT)`,
    # before any window exists. Job-level rather than per-step because every step that touches the
    # engine needs it and a step that quietly does not would fault in a way that looks like nothing to
    # do with this. Measured and written up in docs/ENGINE.md.
    env:
      XDG_SESSION_TYPE: x11
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      # The engine's identity, established rather than assumed. No engine is committed any more, so this
      # downloads it and verifies the download against the SHA-256 in `external/sciter/VENDORED.md` -
      # the switch docs/UPGRADING.md predicted, and it cost this line. `ensure-engine` would do it from
      # the first build recipe anyway; it is a step of its own so a bad pin fails here, named.
      #
      # **Before the dependency step, not after.** install-linux-deps.sh runs `ldd` on the engine as
      # evidence, which was free while the binary was committed and is a failed job now if nothing has
      # fetched it yet. That was the first thing the un-vendoring broke.
      #
      # Worth naming because the failure it catches is otherwise baffling: the upstream tag `6.0.4.9`
      # serves a libsciter.so of *exactly* the same size as `6.0.4.9-bis` and a different hash, so "the
      # right size, the wrong engine" is a state that exists.
      - name: Fetch and verify the pinned engine
        run: just fetch-engine

      # X11 and EGL development packages, the engine's own runtime dependencies, and fonts. The script
      # says which group is which and how each one fails when it is missing.
      - name: Install build and runtime dependencies
        run: .github/scripts/install-linux-deps.sh

      # `-vet`, `-vet-cast`, `-strict-style` and `-vet-tabs` were configured in the justfile and then
      # never run by anything, so they enforced nothing. Seconds and no display, so it goes early: a
      # shadowed declaration is cheaper to hear about before a 45-minute test job.
      #
      # Both library packages *and* every example. The examples used to be excluded - which meant the
      # vet flags covered the third of the code least likely to be read closely - and the cleanup that
      # let them in was 25 findings, all unused imports, unused locals and shadowed `err`s.
      - name: Lint
        run: just lint

      # The step the upgrade procedure exists for. No display needed - it loads the library and walks
      # the table without creating a window.
      - name: Verify the ISciterAPI table
        run: just api-map-verify

      # Its other half: api-map-verify catches a slot that moved or vanished, this catches one that
      # appeared and nobody wrapped. Headers only, so it needs no engine.
      - name: Check C-API coverage against the baseline
        run: just parity --check

      # The counts README.md and docs/PLAN.md quote about this repository. They are the cheapest claims
      # to check and the first ones a sceptical reader checks, and they had drifted by 29 tests.
      - name: Check the documented counts
        run: just stats --check

      # The ownership rule in docs/rules.md section 4 - if it takes an allocator the result is yours,
      # otherwise it is borrowed. It holds across all 30 procedures that return memory today, and it
      # only keeps holding if something checks: a rule with no check is the same shape as a lint job
      # that never runs. Headers and signatures only, so it needs no engine.
      - name: Check the ownership rule
        run: just check-ownership

      - name: Type check everything
        run: just check

      # `check` type checks; this links. `odin check` cannot see an undefined symbol, and that is the
      # whole reason both steps exist - see the comment on `build-examples` in the justfile.
      - name: Build and link every example
        run: just build-examples

      # Is there a working renderer at all? The engine draws through EGL/GLESv2, so on a runner with no
      # GPU everything below depends on llvmpipe being reachable. Printed before the tests rather than
      # inferred from their wreckage: a segfault inside the first windowed test looks identical whether
      # the cause is the bindings or an EGL that never initialised.
      - name: Probe the display stack
        continue-on-error: true
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set -uo pipefail
          xvfb-run -a -s "-screen 0 1280x1024x24" glxinfo -B
          xvfb-run -a -s "-screen 0 1280x1024x24" bash -c 'echo "DISPLAY=$DISPLAY"; xdpyinfo | head -12'

      # The precondition for everything below, asked separately because a failure of it is unreadable
      # inside the test job. If the engine cannot create a window here, `wing::window::create` fails,
      # its cleanup path faults in `XDestroyIC`, and every windowed test dies with SIGSEGV at
      # `create_window` while the test runner hangs until EXAMPLE_TEST_TIMEOUT - forty-five minutes of
      # identical segfaults that read like a broken binding and are one missing renderer. Twenty
      # seconds, and it prints the EGL diagnosis when it fails. Not continue-on-error: nothing after
      # this can pass if it does not.
      - name: Can the engine create a window here?
        env:
          XMODIFIERS: '@im=none'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" just window-canary

      # Xvfb because the windowed tests gate themselves on DISPLAY/WAYLAND_DISPLAY and would otherwise
      # skip ~two thirds of the suite. The screen is given explicitly because Xvfb's default depth is
      # not guaranteed to be 24, and an 8-bit screen is a rendering failure that looks like an engine
      # bug. XMODIFIERS=@im=none because this engine build segfaults in XSetICFocus when a window takes
      # focus and an X input method is present - see README.md. LIBGL_ALWAYS_SOFTWARE and
      # GALLIUM_DRIVER because the runner has no GPU: the first covers the GL path, the second is the
      # one that applies to EGL, which is what the engine actually uses.
      #
      # EXAMPLE_TEST_TIMEOUT bounds each example rather than the job: a windowed test on a display that
      # cannot render blocks on the message pump, and a job-level timeout would tell you only that
      # something hung. `exit 124` in the recipe's summary is that ceiling firing.
      #
      # No blanket retry: the recipe now runs every example and reports which ones failed, so one red
      # run is a complete picture. If the timing-sensitive element-timer tests in events.odin turn out
      # to flake here the way they do on a loaded desktop, that is a reason to fix the tests, not to
      # run the suite twice.
      # `sqlite_extension`'s end-to-end test loads `odin-sqlite` through `sciter.loadLibrary` from
      # script, so it needs the extension built and sitting in target/debug. Nothing built it, so that
      # test has skipped itself in CI **on every platform since it was written** - and it is the only
      # coverage `SciterLibraryInit`, the native-extension entry point, has anywhere. One `odin build
      # -build-mode:shared`, seconds, no SDK required (that is `just extension-run`, which needs scapp).
      #
      # It still skips where there is no libsqlite3 to open - Windows, unless the machine happens to
      # have one of `winsqlite3.dll` / `sqlite3.dll`. Linux and macOS both have it: note that
      # /usr/lib/libsqlite3.dylib does not exist as a *file* on macOS 11+, and `dlopen` by name gets it
      # from the dyld shared cache anyway, which is how SQLITE_LIBRARY_NAMES asks for it.
      - name: Build the SQLite native extension
        run: just extension sqlite_extension odin-sqlite

      - name: Run the example tests
        timeout-minutes: 45
        env:
          XMODIFIERS: '@im=none'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          EXAMPLE_TEST_TIMEOUT: '420'
        run: xvfb-run -a -s "-screen 0 1280x1024x24" just example-tests

      # Engine-side resources - Values, element references, taken requests, images - are invisible to
      # Odin's allocator tracking, so nothing above would notice the wrapper leaking one. This exercises
      # the owning paths under the debug ledger and fails if anything is still held at exit.
      - name: Leak sweep
        run: xvfb-run -a -s "-screen 0 1280x1024x24" just leak-check

      # Value refcounting is the code most worth running under a sanitizer, and per the justfile's own
      # notes Linux ASan catches heap errors that Windows ASan does not - so this runs here or nowhere.
      - name: Value refcounting under ASan
        timeout-minutes: 20
        env:
          XMODIFIERS: '@im=none'
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: xvfb-run -a -s "-screen 0 1280x1024x24" just test_sanitize eval

  cross-check:
    name: cross target type check (windows, macos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}
      # No engine needed: this is `odin check -target:`, the cheap half of a port. It is the only
      # thing standing between a Linux-only edit and a platform that stops compiling silently.
      - run: just cross-check

  windows:
    name: windows x64 (engine fetched)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      # The `is the engine vendored?` gate that used to be here is gone with the engine it guarded: no
      # platform's binary is committed now, so the answer would be "no" on every run and the job would
      # skip itself in perpetuity while reporting green - the exact failure mode the macOS job's dead
      # glob had. The fetch below is the gate; it fails loudly, which is what a gate is for.
      #
      # The same step the Linux job runs, and it means something here now that `engine_sha256` is
      # per-platform: it used to be one value, so fetching on Windows compared sciter.dll against the
      # Linux .so's digest and refused to install.
      - name: Fetch and verify the pinned engine
        run: just fetch-engine

      # Checklist step 2, now a real gate rather than a report: the null list and the symbol names were
      # measured on a Windows machine on 2026-08-15 and are pinned in check-api-map.py. The prediction
      # that lived here - "sciter.dll exports one symbol, so containment is all that can be asserted" -
      # was wrong twice over, and usefully: the DLL exports 276 symbols, so the name check is as strong
      # as Linux's, and the Windows null list is the Linux one minus SciterProcND rather than the
      # D2D-filled list that was expected.
      - name: Verify the ISciterAPI table
        run: just api-map-verify

      # Checklist step 4. `single_binary.odin`'s `when` now covers windows_amd64, and `just check` skips
      # the two raw-Xlib examples off Linux - without that skip this step could never have passed.
      - name: Type check everything
        run: just check

      # `check` type checks; this links. `odin check` cannot see an undefined symbol, and that is the
      # whole reason both steps exist - see the comment on `build-examples` in the justfile.
      - name: Build and link every example
        run: just build-examples

      # Checklist step 5. The display gate is right for this platform: `have_display` in the examples
      # returns true unconditionally `when ODIN_OS == .Windows`, because DISPLAY and WAYLAND_DISPLAY are
      # X11/Wayland variables that would otherwise skip every windowed test here forever, silently.
      # Confirmed on a real machine: the windowed tests run. The remaining open items for this job are in
      # docs/WINDOWS-CHECKLIST.md rather than in this comment.
      #
      # EXAMPLE_TEST_TIMEOUT for the same reason as the Linux job, and it matters more here: a test that
      # provokes a C++ throw from the engine can leave the runner waiting forever, which is why several
      # tests carry a `when ODIN_OS != .Windows` guard - see docs/odin-test-runner-windows.patch. The
      # ceiling kills the whole process tree (`run_with_timeout` in justlib.py), not just `just`, which
      # the GNU `timeout` this replaced did not.
      #
      # This step is green. It was not, for three examples, until the cause was found: a window whose
      # document never renders any text faults inside sciter.dll at process exit, and those three had
      # text-free test documents. Section 1 of docs/WINDOWS-CHECKLIST.md has the reproduction and the
      # one-character workaround, which lives in the documents themselves.
      # `sqlite_extension`'s end-to-end test loads `odin-sqlite` through `sciter.loadLibrary` from
      # script, so it needs the extension built and sitting in target/debug. Nothing built it, so that
      # test has skipped itself in CI **on every platform since it was written** - and it is the only
      # coverage `SciterLibraryInit`, the native-extension entry point, has anywhere. One `odin build
      # -build-mode:shared`, seconds, no SDK required (that is `just extension-run`, which needs scapp).
      #
      # It still skips where there is no libsqlite3 to open - Windows, unless the machine happens to
      # have one of `winsqlite3.dll` / `sqlite3.dll`. Linux and macOS both have it: note that
      # /usr/lib/libsqlite3.dylib does not exist as a *file* on macOS 11+, and `dlopen` by name gets it
      # from the dyld shared cache anyway, which is how SQLITE_LIBRARY_NAMES asks for it.
      - name: Build the SQLite native extension
        run: just extension sqlite_extension odin-sqlite

      - name: Run the example tests
        timeout-minutes: 45
        env:
          EXAMPLE_TEST_TIMEOUT: '420'
        run: just example-tests

  # **This job is the Mac.** Nobody working on this repository owns one, so `macos-14` is where the
  # macOS port is brought up: arm64, free on a public repository, and able to run every step the
  # Windows desktop ran except the one that matters most - no human here can see whether a window
  # renders blank rather than correctly. README.md's platform table says exactly that, and this job is
  # what backs the half of the claim it can back.
  #
  # Ordered like the Linux job, and for the same reasons: verify the engine, then ask whether a window
  # can exist at all, then spend the forty-five minutes.
  macos:
    name: macos arm64 (engine fetched)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
        with:
          odin-version: ${{ env.ODIN_VERSION }}
          just-version: ${{ env.JUST_VERSION }}

      # **The macOS engine is fetched, not committed** - the one platform where it is, because the file
      # is universal (x86_64 + arm64) and therefore 50 MB, half of it dead weight on any given machine.
      # So this is `fetch-engine` and not `fetch-engine --check`: the file is never in the checkout. It
      # downloads once, verifies against `engine_sha256`, and fails loudly on a mismatch - the same
      # verification `--check` performs, plus the download. `ensure-engine` would do it anyway before
      # the first build; it is an explicit step so a bad pin fails here rather than inside `just check`.
      #
      # Note the path has no arch component. `src/prelude.odin` searches `lib/macosx`, `engine_rel` is
      # `macosx/libsciter.dylib`, and the SDK's own layout is `bin/macosx/` - one universal file, so
      # there is nothing to split by arch. An earlier gate here globbed `lib/macosx/*/libsciter.dylib`
      # and could therefore never fire, which left this whole job silently skipped.
      - name: Fetch and verify the pinned engine
        run: just fetch-engine

      # Both slices, and the signature. One line of output that answers three questions the runtime
      # steps would otherwise answer with a SIGKILL: is the arm64 slice there, is it signed at all
      # (arm64 macOS will not map unsigned code), and did the checkout attach a quarantine attribute.
      - name: What the dylib is
        run: |
          set -uo pipefail
          lipo -archs lib/macosx/libsciter.dylib
          codesign -dv --verbose=2 lib/macosx/libsciter.dylib 2>&1 | head -8
          xattr -l lib/macosx/libsciter.dylib || echo "(no extended attributes)"

      # The step the upgrade procedure exists for. No window needed - it loads the library and walks the
      # table. The macOS null list is not pinned yet, so this *reports* the list it finds rather than
      # enforcing it; the value it prints is what goes into MACOS_NULLS in check-api-map.py, and only
      # then does it become a gate. See docs/MACOS-CHECKLIST.md for the prediction it is measured
      # against.
      - name: Verify the ISciterAPI table
        run: just api-map-verify

      - name: Type check everything
        run: just check

      # `check` type checks; this links. `odin check` cannot see an undefined symbol, and that is the
      # whole reason both steps exist - see the comment on `build-examples` in the justfile.
      - name: Build and link every example
        run: just build-examples

      # The precondition for everything below. On Linux this catches a missing renderer; here the
      # question is whether a process in this runner's launchd session can talk to WindowServer at all.
      # If it cannot, every windowed test faults identically and the job below is forty-five minutes of
      # noise. `.github/scripts/macos-canary.sh` prints the session type, the signature, the arch and an
      # lldb backtrace when the answer is no.
      - name: Can the engine create a window here?
        run: just window-canary

      # EXAMPLE_TEST_TIMEOUT bounds each example rather than the job, for the same reason as the other
      # two platforms: a windowed test that blocks on the message pump would otherwise be reported only
      # as "something hung".
      #
      # The open question this step answers is the main-thread one. AppKit requires window work on the
      # main thread and Odin's test runner does not run tests there, so the windowed tests may fault
      # where the canary above passed. That would be the macOS analogue of the Windows test-runner
      # finding (docs/odin-test-runner-windows.patch), and docs/MACOS-CHECKLIST.md carries the
      # prediction and the fallback.
      # `sqlite_extension`'s end-to-end test loads `odin-sqlite` through `sciter.loadLibrary` from
      # script, so it needs the extension built and sitting in target/debug. Nothing built it, so that
      # test has skipped itself in CI **on every platform since it was written** - and it is the only
      # coverage `SciterLibraryInit`, the native-extension entry point, has anywhere. One `odin build
      # -build-mode:shared`, seconds, no SDK required (that is `just extension-run`, which needs scapp).
      #
      # It still skips where there is no libsqlite3 to open - Windows, unless the machine happens to
      # have one of `winsqlite3.dll` / `sqlite3.dll`. Linux and macOS both have it: note that
      # /usr/lib/libsqlite3.dylib does not exist as a *file* on macOS 11+, and `dlopen` by name gets it
      # from the dyld shared cache anyway, which is how SQLITE_LIBRARY_NAMES asks for it.
      - name: Build the SQLite native extension
        run: just extension sqlite_extension odin-sqlite

      - name: Run the example tests
        timeout-minutes: 45
        env:
          EXAMPLE_TEST_TIMEOUT: '420'
        run: just example-tests

      # Engine-side resources are invisible to Odin's allocator tracking, so nothing above would notice
      # the wrapper leaking one. Cheap, and it ran clean on both other platforms - a macOS-only leak
      # would be a real finding.
      - name: Leak sweep
        run: just leak-check
